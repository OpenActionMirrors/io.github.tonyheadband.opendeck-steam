<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Launch Steam Game</title>
    <style>
      body { margin: 0; padding: 12px; font: 13px sans-serif; color: #d8d8d8; }
      label { display: block; margin: 10px 0 6px; }
      select { width: 100%; padding: 4px; }
      input[type=range] { width: 100%; }
      #note { margin-top: 10px; color: #f5a623; }
    </style>
  </head>
  <body>
    <label for="game">Game</label>
    <select id="game"></select>
    <label for="art">Art</label>
    <select id="art"></select>
    <label for="scale">Image size: <span id="scaleValue">100</span>%</label>
    <input id="scale" type="range" min="20" max="100" step="5" value="100" />
    <div id="note"></div>
    <script src="launch.js"></script>
  </body>
</html>
